/* ==========================================================================
   Digitakt Practice Coach
   Graphite chassis, a black OLED for parameter names (inverted when locked,
   as the screen shows a parameter lock), red trig keys, Elektron-orange
   secondary functions, and the Digitakt's own LED meanings.
   Dark-first: bare :root carries the dark palette; light is the swap.
   ========================================================================== */

:root {
  color-scheme: dark;
  --ink:       #0f1012;
  --panel:     #17181b;
  --panel-2:   #1d1f22;
  --panel-3:   #25272b;
  --line:      #2f3136;
  --line-soft: #212327;

  --text:   #ecece8;
  --text-2: #b4b5b1;
  --dim:    #86888d;
  --dim-2:  #5c5e64;

  /* the Digitakt's LED vocabulary */
  --red:     #ff4a45;   /* note trig, active track and pattern */
  --orange:  #ff8b36;   /* secondary functions printed on the panel */
  --yellow:  #ffd033;   /* lock trig */
  --green:   #45d16e;   /* global mute mode, step-record cursor */
  --magenta: #d35cff;   /* pattern mute mode */
  --blue:    #5b8dff;   /* octave duplicates, first slice */

  --accent:     #ff4a45;
  --accent-ink: #1d0302;
  --done:       #45d16e;
  --work:       #ffd033;
  --warn:       #ff8b36;
  --hear:       #5b8dff;
  --musical:    #d35cff;

  --oled-bg: #000000;
  --oled-fg: #f3f5ef;
  --oled-dim: #6f7370;

  --pad-bg:   #2a2c31;
  --pad-bd:   #3a3d43;
  --pad-num:  #9a9ca1;

  --glow:        0 0 0 1px rgba(255,74,69,.4), 0 0 18px -6px rgba(255,74,69,.55);
  --shadow:      0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.9);
  --modalshadow: 0 30px 80px -20px rgba(0,0,0,.85);
  --scrim:       rgba(4,5,7,.72);
  --railshadow:  0 0 60px rgba(0,0,0,.6);

  --rail-w: 272px;
  --measure: 68ch;

  --f-display: "Chakra Petch", "Arial Narrow", Arial, sans-serif;
  --f-body:    "IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --f-mono:    "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-oled:    "VT323", "IBM Plex Mono", ui-monospace, monospace;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--ink);
  color: var(--text);
  font: 400 15px/1.6 var(--f-body);
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 600;
  line-height: 1.15;
  text-wrap: balance;
  margin: 0;
}
p { margin: 0; }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
::selection { background: var(--accent); color: var(--accent-ink); }

.eyebrow {
  font-family: var(--f-display);
  font-weight: 600; font-size: 11.5px;
  letter-spacing: .14em; text-transform: uppercase;
  color: var(--dim);
}

/* ==========================================================================
   Shell
   ========================================================================== */

.app { display: flex; min-height: 100%; }

.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 40;
  display: flex; align-items: center; gap: 12px;
  flex-wrap: wrap; row-gap: 8px;
  padding: 10px 18px;
  background: var(--ink);
  border-bottom: 1px solid var(--line-soft);
}

.brand { display: flex; align-items: baseline; gap: 9px; margin-right: auto; min-width: 0; }
.brand__t1 {
  font-family: var(--f-oled); font-size: 19px; line-height: 1; letter-spacing: .04em;
  color: var(--oled-fg); background: var(--oled-bg);
  padding: 3px 7px 2px; border-radius: 3px; flex: none;
  border: 1px solid var(--line);
}
.brand__name {
  font-family: var(--f-display); font-weight: 700; font-size: 16px; letter-spacing: .03em;
  white-space: nowrap;
}
.brand__sub {
  font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
@media (max-width: 1180px) { .brand__sub { display: none; } }
@media (max-width: 620px)  { .brand__name { display: none; } }

.tool {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px;
  font-family: var(--f-display); font-size: 12.5px; font-weight: 600;
  letter-spacing: .05em; text-transform: uppercase;
  color: var(--text-2);
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel);
  white-space: nowrap;
}
.tool:hover { color: var(--text); border-color: var(--dim-2); }
.tool.is-on { color: var(--accent); border-color: var(--accent); }

@media (max-width: 520px) {
  .topbar { gap: 6px; padding: 8px 12px; }
  .topbar .tool { padding: 5px 8px; font-size: 11.5px; letter-spacing: .03em; }
}
@media (max-width: 400px) { .brand__t1 { display: none; } }

/* ---------- rail ---------- */
.rail {
  flex: 0 0 var(--rail-w);
  width: var(--rail-w);
  border-right: 1px solid var(--line-soft);
  background: var(--panel);
  display: flex; flex-direction: column;
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: flex-start;
  height: 100vh; overflow-y: auto;
  overscroll-behavior: contain;
}
.rail__head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line-soft); }
.overall { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.overall__pct {
  font-family: var(--f-display); font-weight: 700; font-size: 30px;
  font-variant-numeric: tabular-nums; color: var(--text);
}
.overall__of { font-size: 12.5px; color: var(--dim); }

.meter { height: 4px; border-radius: 99px; background: var(--panel-3); overflow: hidden; display: flex; }
.meter__done { background: var(--done); }
.meter__work { background: var(--work); }

.rail__list { list-style: none; margin: 0; padding: 8px 0 24px; }
.unitbtn {
  display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px;
  width: 100%; text-align: left;
  padding: 9px 18px 10px;
  border-left: 2px solid transparent;
}
.unitbtn:hover { background: var(--panel-2); }
.unitbtn[aria-current="true"] { background: var(--panel-2); border-left-color: var(--accent); }
.unitbtn__n {
  grid-row: 1 / span 2;
  font-family: var(--f-mono); font-size: 11px; font-weight: 500;
  color: var(--dim-2); padding-top: 3px; font-variant-numeric: tabular-nums;
}
.unitbtn[aria-current="true"] .unitbtn__n { color: var(--accent); }
.unitbtn__t { font-family: var(--f-display); font-weight: 600; font-size: 14px; color: var(--text-2); }
.unitbtn[aria-current="true"] .unitbtn__t, .unitbtn:hover .unitbtn__t { color: var(--text); }
.unitbtn__m { display: flex; align-items: center; gap: 7px; }
.unitbtn__m .meter { flex: 1; height: 3px; }
.unitbtn__c { font-family: var(--f-mono); font-size: 10px; color: var(--dim-2); font-variant-numeric: tabular-nums; }
.unitbtn.is-complete .unitbtn__c { color: var(--done); }

.rail__foot {
  margin-top: auto; padding: 14px 18px 20px;
  border-top: 1px solid var(--line-soft);
  display: flex; flex-direction: column; gap: 8px;
}
.rail__foot .tool { justify-content: center; }
.provenance { font-size: 11.5px; line-height: 1.5; color: var(--dim-2); }
.warnnote {
  font-size: 11.5px; line-height: 1.5; color: var(--work);
  border: 1px solid var(--work); border-radius: 4px; padding: 8px 10px; background: var(--panel-2);
}

.railtoggle { display: none; }
.scrim { display: none; }
@media (max-width: 900px) {
  .app { display: block; }
  .railtoggle { display: inline-flex; }
  .rail {
    position: fixed; top: 0; bottom: 0; left: -340px; z-index: 60;
    height: 100%; width: min(84vw, 320px); flex-basis: auto;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
    transition: left .22s ease;
    box-shadow: var(--railshadow);
  }
  .rail.is-open { left: 0; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 50; background: var(--scrim); }
}

.main { flex: 1 1 auto; min-width: 0; }
.wrap { padding-left: 18px; padding-right: 18px; padding-bottom: 96px; }
.wrap > * { max-width: var(--measure); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ==========================================================================
   Notation chips
   ========================================================================== */

.chip {
  display: inline-flex; align-items: center;
  font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .02em;
  padding: 1px 5px 2px;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text-2);
  white-space: nowrap; vertical-align: baseline;
}
.chip--key  { color: var(--text); border-color: var(--dim-2); }
.chip--pad  { color: var(--red); border-color: var(--red); }
.chip--mod  { color: var(--orange); border-color: var(--orange); border-style: dashed; }
.chip--knob {
  color: var(--text); border-color: var(--dim);
  border-radius: 99px; min-width: 1.9em; justify-content: center; padding-inline: 6px;
}
.chip--val  { color: var(--text); background: var(--panel-3); font-variant-numeric: tabular-nums; }
.chip--val .neg { text-decoration: overline; text-decoration-thickness: 1.5px; }
.chip--param {
  font-family: var(--f-oled); font-size: 17px; line-height: 1; letter-spacing: .03em;
  padding: 1px 5px 0;
  color: var(--oled-fg); background: var(--oled-bg); border-color: #3a3a3a;
}
.chip--param.is-locked { color: var(--oled-bg); background: var(--oled-fg); border-color: var(--oled-fg); }

.gesture { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

/* ==========================================================================
   Unit view
   ========================================================================== */

.unithead { padding-top: 30px; padding-bottom: 22px; }
.unithead__n { font-family: var(--f-mono); font-size: 12px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.unithead h2 { font-size: clamp(26px, 5vw, 34px); letter-spacing: -.005em; margin: 6px 0 10px; }
.unithead__tag { color: var(--dim); font-size: 14px; }
.unithead__intro { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line-soft); color: var(--text-2); font-size: 15.5px; }
.unitmeter { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.unitmeter .meter { flex: 1; height: 5px; }
.unitmeter__c { font-family: var(--f-mono); font-size: 11.5px; color: var(--dim); font-variant-numeric: tabular-nums; }

.checklist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.item {
  border-bottom: 1px solid var(--line-soft);
  border-left: 2px solid var(--line);
  padding: 15px 0 15px 16px;
  display: grid; grid-template-columns: 24px 1fr; gap: 4px 13px;
  align-items: start;
  transition: border-color .15s ease;
}
.item.is-done      { border-left-color: var(--done); }
.item.is-needswork { border-left-color: var(--work); }

.tick {
  grid-row: 1 / span 3;
  width: 22px; height: 22px; margin-top: 1px;
  border: 1.5px solid var(--dim-2); border-radius: 4px;
  display: grid; place-items: center;
  color: transparent;
}
.tick:hover { border-color: var(--text-2); }
.tick svg { width: 13px; height: 13px; }
.item.is-done .tick { background: var(--done); border-color: var(--done); color: var(--ink); }
.item.is-needswork .tick { border-color: var(--work); }
.item.is-needswork .tick svg { display: none; }
.item.is-needswork .tick::after { content: ""; width: 7px; height: 7px; border-radius: 99px; background: var(--work); }

.item__t { font-family: var(--f-display); font-weight: 600; font-size: 16.5px; color: var(--text); }
.item__s { color: var(--text-2); font-size: 14.5px; }
.item__foot { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 3px; }

.teach {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--f-display); font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase;
  color: var(--accent);
  padding: 3px 0;
  border-bottom: 1px solid var(--line);
}
.teach:hover { border-bottom-color: var(--accent); }
.state { font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--dim-2); }
.item.is-done .state { color: var(--done); }
.item.is-needswork .state { color: var(--work); }

.mref { font-family: var(--f-mono); font-size: 10.5px; color: var(--dim-2); letter-spacing: .02em; }
.mref a { color: var(--dim); }
.mref a:hover { color: var(--accent); }
.mref--foot { margin-left: auto; align-self: center; }

.finale {
  margin-top: 30px; padding: 20px 22px;
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; box-shadow: var(--shadow);
}
.finale.is-locked { opacity: .6; }
.finale h3 { font-size: 19px; margin: 6px 0 10px; }
.finale p { color: var(--text-2); }
.finale ol { color: var(--text-2); margin: 12px 0 0; padding-left: 20px; }
.finale li { margin-bottom: 7px; }
.finale__lock { font-family: var(--f-mono); font-size: 11px; color: var(--dim); margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); }

/* ==========================================================================
   Lesson
   ========================================================================== */

.lesson {
  grid-column: 2;
  margin: 14px 0 4px;
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent);
  border-radius: 5px;
  background: var(--panel);
  box-shadow: var(--shadow);
}
.lesson__in { padding: 18px 20px 20px; }
.lesson section + section, .lesson section + .widget, .lesson .widget + section { margin-top: 20px; }
.lesson h4 { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
.lesson p { color: var(--text-2); font-size: 15px; }
.lesson ol, .lesson ul { margin: 0; padding-left: 21px; color: var(--text-2); font-size: 15px; }
.lesson li { margin-bottom: 7px; }
.lesson li:last-child { margin-bottom: 0; }
.lesson__why { font-size: 16px; color: var(--text); border-left: 2px solid var(--line); padding-left: 14px; }

.hear { background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 13px 15px; }
.hear h4 { color: var(--hear); }
.hear p { color: var(--text); }
.gotcha { background: var(--panel-2); border: 1px solid var(--warn); border-radius: 5px; padding: 13px 15px; }
.gotcha h4 { color: var(--warn); }
.musical h4 { color: var(--musical); }

.lesson__foot {
  display: flex; flex-wrap: wrap; align-items: center; gap: 9px;
  padding: 15px 20px;
  border-top: 1px solid var(--line-soft);
  background: var(--panel-2);
  border-radius: 0 0 5px 5px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 9px 15px;
  font-family: var(--f-display); font-weight: 600; font-size: 13.5px;
  letter-spacing: .05em; text-transform: uppercase;
  border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel-3); color: var(--text);
}
.btn:hover { border-color: var(--dim-2); }
.btn--go { background: var(--done); border-color: var(--done); color: var(--ink); }
.btn--go:hover { filter: brightness(1.08); border-color: var(--done); }
.btn--warn { background: transparent; border-color: var(--work); color: var(--work); }
.btn--warn:hover { border-color: var(--work); filter: brightness(1.15); }
.btn--accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); box-shadow: var(--glow); }
.btn--accent:hover { filter: brightness(1.07); border-color: var(--accent); }
.btn--ghost { background: transparent; color: var(--text-2); }

/* ==========================================================================
   Confirm modal and toasts
   ========================================================================== */

.modalscrim {
  position: fixed; inset: 0; z-index: 90;
  display: grid; place-items: center;
  padding: 18px;
  background: var(--scrim);
  animation: fade .16s ease;
}
@keyframes fade { from { opacity: 0 } }
.modal {
  width: min(520px, 100%);
  max-height: calc(100vh - 36px); overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--line);
  border-top: 3px solid var(--accent);
  border-radius: 7px;
  box-shadow: var(--modalshadow);
  padding: 24px 24px 20px;
}
.modal__q { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.25; margin: 8px 0 12px; }
.modal__s { color: var(--text-2); font-size: 15px; }
.modal__gesture { margin-top: 14px; }
.modal__acts { display: flex; flex-direction: column; gap: 9px; margin-top: 22px; }
.modal__acts .btn { width: 100%; padding: 12px 16px; }
.modal__recap { margin-top: 18px; padding: 15px 16px; background: var(--panel-2); border: 1px solid var(--line-soft); border-radius: 5px; }
.modal__recap h4 { font-family: var(--f-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--work); margin-bottom: 7px; }
.modal__recap p { color: var(--text-2); font-size: 14.5px; }

.toasts {
  position: fixed; z-index: 95;
  left: 0; right: 0; margin-inline: auto;
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  pointer-events: none;
  width: min(440px, calc(100% - 36px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: center; gap: 12px;
  width: 100%; padding: 10px 14px;
  background: var(--panel-3); color: var(--text);
  border: 1px solid var(--line); border-radius: 5px;
  box-shadow: var(--modalshadow);
  font-size: 14px;
  animation: rise .18s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px) } }
.toast__led { width: 8px; height: 8px; border-radius: 99px; background: var(--done); flex: none; }
.toast__led--amber { background: var(--work); }
.toast__led--orange { background: var(--orange); }
.toast button {
  margin-left: auto; flex: none;
  font-family: var(--f-display); font-size: 12px; font-weight: 600;
  letter-spacing: .06em; text-transform: uppercase; color: var(--accent);
}

/* ==========================================================================
   Widgets
   ========================================================================== */

.widget { margin-top: 16px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); }
.widget__head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 14px; border-bottom: 1px solid var(--line-soft);
}
.widget__title {
  font-family: var(--f-display); font-size: 11.5px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
  margin-right: auto;
}
.widget__body { padding: 14px; display: grid; gap: 12px; }
.subhead {
  font-family: var(--f-display); font-size: 11.5px; font-weight: 600;
  letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
  padding-top: 10px; border-top: 1px dashed var(--line);
}

.readout {
  font-size: 13.5px; color: var(--text-2); line-height: 1.6;
  padding-top: 10px; border-top: 1px dashed var(--line);
}
.readout b { color: var(--text); font-weight: 600; }

/* pickers and sliders */
.picker { display: flex; flex-wrap: wrap; gap: 5px; }
.pick {
  padding: 4px 9px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--panel); color: var(--text-2);
  font-family: var(--f-mono); font-size: 12px;
}
.pick:hover { border-color: var(--dim-2); color: var(--text); }
.pick.is-on { border-color: var(--accent); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.pick .chip { border: 0; background: none; padding: 0; }

.controls { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.ctrl { display: grid; gap: 4px; align-content: start; }
.ctrl__lab {
  display: flex; justify-content: space-between; align-items: baseline;
  font-family: var(--f-mono); font-size: 10.5px; letter-spacing: .06em;
  text-transform: uppercase; color: var(--dim);
}
.ctrl__val { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.ctrl input[type="range"] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: none; margin: 0; }
.ctrl input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 99px; background: var(--panel-3); }
.ctrl input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px; border-radius: 99px; margin-top: -5.5px;
  background: var(--accent); border: 0;
}
.ctrl input[type="range"]::-moz-range-track { height: 3px; border-radius: 99px; background: var(--panel-3); }
.ctrl input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 99px; background: var(--accent); }

/* trig keys — two rows of eight, as on the panel */
.grid { display: flex; flex-direction: column; gap: 6px; }
.grid__row { display: grid; gap: 5px; }
.cell {
  position: relative;
  min-width: 0; max-width: 100%;
  aspect-ratio: 1;
  border-radius: 3px;
  background: var(--pad-bg);
  border: 1px solid var(--pad-bd);
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 10px; color: var(--pad-num);
  font-variant-numeric: tabular-nums;
}
.grid--pads .cell { aspect-ratio: 1.05; font-size: 12px; }
.cell__n { position: relative; z-index: 1; line-height: 1; text-align: center; padding: 0 2px; overflow: hidden; }
.cell.beat { box-shadow: inset 0 0 0 1px var(--pad-num); }
.cell.on, .cell.t-note { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 12px -3px var(--red); }
.cell.t-lock { background: var(--yellow); border-color: var(--yellow); color: #231a00; }
.cell.t-locked { animation: blink 1.1s steps(2, start) infinite; }
.cell.t-cond::after {
  content: ""; position: absolute; top: 4px; right: 4px;
  width: 6px; height: 6px; border-radius: 99px; background: currentColor; opacity: .85;
}
.cell.t-dim { opacity: .45; }
.cell.t-blue { background: var(--blue); border-color: var(--blue); color: #fff; }
.cell.play { outline: 2px solid var(--text); outline-offset: 1px; }
@keyframes blink { to { filter: brightness(.45); } }

/* condition explorer */
.loops { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 4px; }
.loop {
  position: relative; aspect-ratio: 1; min-width: 0;
  border-radius: 3px; background: var(--pad-bg); border: 1px solid var(--pad-bd);
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 10px; color: var(--pad-num);
}
.loop.on { background: var(--red); border-color: var(--red); color: #fff; }
.loop.is-fill { box-shadow: inset 0 3px 0 var(--yellow); }
.loop.play { outline: 2px solid var(--text); outline-offset: 1px; }
.loop.sm { aspect-ratio: auto; height: 16px; }
.chain { display: grid; gap: 6px; }
.chain__row { display: grid; grid-template-columns: minmax(150px, 34%) 1fr; gap: 10px; align-items: center; }
.chain__lab { font-size: 12.5px; color: var(--text-2); }
.chain__cells { display: grid; grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 3px; }
@media (max-width: 560px) {
  .chain__row { grid-template-columns: 1fr; gap: 4px; }
  .loops { gap: 2px; }
}

/* svg diagrams */
.svgbox, .scale { width: 100%; }
.svgbox svg, .scale svg { display: block; width: 100%; height: auto; max-width: 100%; }
.sc-bar { stroke: var(--line); stroke-width: 1; }
.sc-reset { stroke: var(--red); stroke-width: 2; stroke-dasharray: 4 3; }
.sc-lab { fill: var(--dim); font: 500 10px var(--f-mono); }
.sc-name { fill: var(--text-2); font: 500 11px var(--f-mono); }
.sc-lane { fill: var(--panel); stroke: var(--line-soft); }
.sc-step { fill: var(--dim-2); }
.sc-start { fill: var(--red); }
.sc-start.alt { fill: var(--orange); }
.rt-hit { fill: var(--red); }
.lfo-trig { stroke: var(--yellow); stroke-width: 1.5; stroke-dasharray: 3 3; }
.lfo-out { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-linejoin: round; }
.lfo-ghost { fill: none; stroke: var(--dim-2); stroke-width: 1.5; stroke-dasharray: 2 3; }
.env { fill: none; stroke: var(--red); stroke-width: 2.5; stroke-linejoin: round; }
.sw-on { fill: var(--red); }
.sw-off { fill: var(--orange); }
.wav { fill: none; stroke: var(--dim); stroke-width: 1.2; }
.sl-cut { stroke: var(--blue); stroke-width: 1.4; }

/* OLED page map */
.oled {
  background: var(--oled-bg); border: 1px solid #2a2a2a; border-radius: 4px;
  padding: 12px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 10px;
}
.oled__cell { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; border-radius: 2px; }
.oled__p { font-family: var(--f-oled); font-size: 22px; line-height: 1; color: var(--oled-fg); letter-spacing: .04em; }
.oled__k { font-family: var(--f-mono); font-size: 10px; color: var(--oled-dim); }
.oled__cell.is-empty .oled__p { color: var(--oled-dim); }
.oled__cell.is-locked { background: var(--oled-fg); }
.oled__cell.is-locked .oled__p, .oled__cell.is-locked .oled__k { color: var(--oled-bg); }

/* legend and tables */
.legend { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); }
.legend__i { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--text-2); }
.legend__sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 2px solid transparent; }
.legend__sw.is-blink { animation: blink 1.1s steps(2, start) infinite; }
.legend__sw.is-ring { border-width: 2px; }
.tablewrap { overflow-x: auto; }
.wtable { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.wtable th {
  text-align: left; font: 600 10.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase;
  color: var(--dim); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line);
}
.wtable td { padding: 7px 10px 7px 0; border-bottom: 1px solid var(--line-soft); color: var(--text-2); vertical-align: top; }

/* ==========================================================================
   Cheat sheet, recipes, search
   ========================================================================== */

.panelhead { padding-top: 30px; padding-bottom: 18px; }
.panelhead h2 { font-size: clamp(24px, 4.6vw, 31px); margin: 6px 0 8px; }
.panelhead p { color: var(--dim); font-size: 14.5px; }

.filter {
  display: flex; align-items: center; gap: 10px;
  margin: 4px 0 22px; padding: 10px 13px;
  border: 1px solid var(--line); border-radius: 5px;
  background: var(--panel);
}
.filter input { flex: 1; min-width: 0; font: 400 15px/1.4 var(--f-body); background: none; border: 0; color: var(--text); }
.filter input::placeholder { color: var(--dim-2); }
.filter input:focus { outline: none; }
.filter__n { font-family: var(--f-mono); font-size: 11px; color: var(--dim); white-space: nowrap; }

.qc { margin-bottom: 26px; }
.qc h3 { font-size: 12.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.qc__note { color: var(--dim); font-size: 13.5px; margin-top: 9px; }
.qc .mref { display: block; margin-top: 6px; }
.qc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.qc td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
.qc td:first-child { color: var(--text-2); width: 46%; }
.qc td:last-child { padding-right: 0; }

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; }
.chipbtn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 11px;
  font-family: var(--f-display); font-size: 12.5px; font-weight: 600;
  letter-spacing: .04em; text-transform: uppercase;
  color: var(--text-2);
  background: var(--panel); border: 1px solid var(--line); border-radius: 99px;
}
.chipbtn:hover { color: var(--text); border-color: var(--dim-2); }
.chipbtn.is-on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.chipbtn__n { font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: 0; opacity: .75; }

.recipes { border-top: 1px solid var(--line); }
.recipe { border-bottom: 1px solid var(--line-soft); }
.recipe.is-open { padding-bottom: 24px; }
.recipe__head { display: grid; grid-template-columns: 1fr auto; gap: 3px 14px; width: 100%; text-align: left; padding: 16px 2px 15px; }
.recipe__head:hover .recipe__title { color: var(--accent); }
.recipe__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; grid-column: 1; }
.recipe__n { font-family: var(--f-mono); font-size: 10.5px; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.recipe__bpm, .recipe__gear {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .03em;
  padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line);
  color: var(--text-2); background: var(--panel-2);
}
.recipe__bpm { color: var(--blue); border-color: var(--blue); }
.recipe__title { grid-column: 1; font-family: var(--f-display); font-weight: 600; font-size: 19px; color: var(--text); line-height: 1.25; text-wrap: balance; }
.recipe__for { grid-column: 1; color: var(--dim); font-size: 14px; }
.recipe__caret {
  grid-column: 2; grid-row: 1 / span 3; align-self: center;
  width: 26px; height: 26px; border-radius: 4px;
  display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 15px; color: var(--dim);
  border: 1px solid var(--line);
}
.recipe.is-open .recipe__caret { color: var(--accent); border-color: var(--accent); }
.recipe__why { color: var(--text); font-size: 15px; }
.recipe__cols { display: grid; gap: 20px; padding: 4px 2px 0; }
.recipe h4 { font-family: var(--f-display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); margin-bottom: 7px; }
.recipe ol, .recipe ul { margin: 0; padding-left: 20px; color: var(--text-2); font-size: 15px; }
.recipe li { margin-bottom: 7px; }
.recipe__tracks { list-style: none; padding: 0; }
.recipe__tracks li { display: grid; grid-template-columns: 78px 1fr; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line-soft); margin: 0; }
.recipe__tracks b { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; color: var(--red); padding-top: 2px; }

.hit { display: block; width: 100%; text-align: left; border-bottom: 1px solid var(--line-soft); padding: 13px 2px; }
.hit:hover { background: var(--panel); }
.hit__u { font-family: var(--f-mono); font-size: 10.5px; color: var(--accent); letter-spacing: .06em; text-transform: uppercase; }
.hit__t { display: block; font-family: var(--f-display); font-weight: 600; font-size: 16px; margin: 2px 0; }
.hit__s { display: block; color: var(--text-2); font-size: 14px; }
.empty { color: var(--dim); padding: 30px 0; font-size: 15px; }

.pagefoot { margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--line-soft); color: var(--dim-2); font-size: 12.5px; line-height: 1.6; }

[hidden] { display: none !important; }
.tool--accent { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tool--accent:hover { color: var(--accent-ink); filter: brightness(1.07); border-color: var(--accent); }

/* Touch screens — the tablet beside the machine. Every control gets a
   finger-sized target; small visuals keep their look but grow their hit area. */
@media (pointer: coarse) {
  .tool, .chipbtn { min-height: 44px; padding-inline: 14px; }
  .unitbtn { padding-block: 12px 13px; }
  .item { grid-template-columns: 32px 1fr; }
  .tick { position: relative; width: 30px; height: 30px; margin-top: -3px; }
  .tick::before { content: ""; position: absolute; inset: -9px; }
  .tick svg { width: 17px; height: 17px; }
  .teach { min-height: 44px; }
  .mref a { display: inline-block; padding: 10px 6px; margin: -10px -6px; }
  .pick { min-height: 40px; padding: 8px 12px; }
  .modal__acts .btn { min-height: 50px; }
  .recipe__head { min-height: 56px; }
  .ctrl input[type="range"] { height: 44px; }
  .ctrl input[type="range"]::-webkit-slider-thumb { width: 26px; height: 26px; margin-top: -11.5px; }
  .ctrl input[type="range"]::-moz-range-thumb { width: 26px; height: 26px; }
}

   The engine (app.js, widgets.js, styles.css) reads this and nothing else
   device-specific, so a coach for another instrument swaps this file,

window.COACH_DEVICE = {
  id: 'digitakt',
  name: 'Digitakt Practice Coach',
  badge: 'DT',
  shortName: 'Practice Coach',
  subtitle: 'learn the Digitakt with your hands on it',
  storeKey: 'digitakt-practice-coach.v1',
  exportApp: 'digitakt-practice-coach',

  manual: {
    label: 'Digitakt User Manual, OS 1.52A',
    url: 'https://www.elektron.se/wp-content/uploads/2025/07/Digitakt-User-Manual_ENG_OS1.52A_250708.pdf',
    pages: 96
  },

  provenanceShort:
    'Unofficial personal study guide for the Elektron Digitakt (original, OS 1.52A). Every lesson cites a page ' +
    'of the official manual. Not affiliated with Elektron.',
  provenanceLong:
    'Digitakt Practice Coach — an unofficial study guide for the Elektron Digitakt (the original model, OS 1.52A). ' +
    'Device behaviour, key combinations and value ranges are taken from the official Digitakt User Manual and ' +
    'cited by page; the teaching, exercises and musical suggestions are original. Progress is stored only in this browser.',

  /* Panel notation, as written in lesson text:
       [FUNC]        the modifier — secondary functions are printed orange on the panel
       [TRIG 5]      a trig key (also [TRIG], [TRIG 9–16])
       [PLAY]        any other key
       (E)           a DATA ENTRY knob, or (LEVEL/DATA)
       {1/16}        a value; {!FILL} renders with the overline used for negated conditions
       `STRT`        a parameter name as it appears on the OLED; `^FREQ` renders inverted, as a locked parameter does */
  notation: {
    pad: /^TRIG( \d{1,2}([–-]\d{1,2})?)?$/,
    mod: /^FUNC$/,
    params: true
  },

  /* The panel, for the content audit. */
  panel: {
    keys: ['FUNC', 'TRK', 'PTN', 'BANK', 'PAGE', 'YES', 'NO', 'PLAY', 'STOP', 'RECORD', 'TEMPO',
      'SAMPLING', 'SETTINGS', 'SONG MODE', 'TRIG PARAMETERS', 'SRC', 'FLTR', 'AMP', 'LFO',
      'UP', 'DOWN', 'LEFT', 'RIGHT', 'ARROW', 'PARAMETER', 'TRIG'],
    knobs: ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'LEVEL/DATA', 'MASTER VOLUME', 'KNOB']
  },

  recipeGroups: [
    { id: 'all',      label: 'Everything' },
    { id: 'genres',   label: 'Genres' },
    { id: 'weird',    label: 'Weird & polyrhythmic' },
    { id: 'sampling', label: 'Sampling' },
    { id: 'midi',     label: 'MIDI tracks' },
    { id: 'rig',      label: 'Your rig' },
    { id: 'fl',       label: 'FL Studio' }
  ],

  cheatTitle: 'Quick keys',
  recipesIntro: 'Genre builds, polyrhythmic tricks, sampling methods, MIDI-track patches for the gear on your ' +
    'desk, and an FL Studio guide. Nothing here is checked off — it is for playing.',

  hints: {
    cheat: 'Filter — try "mute", "fill", "copy", "retrig", "sampling"',
    search: 'Search every item and lesson — "condition", "slice", "swing", "M.LEN"…',
    recipes: 'Filter — try "slice", "174", "sidechain", "T1", "overbridge"'
  },

  portableName: 'digitakt-practice-coach.html',

  /* The installable build (build-pwa.js) and where deploy-pwa.js publishes it. */
  pwa: {
    shortName: 'DT Coach',
    themeColor: '#0f1012',
    backgroundColor: '#0f1012',

<script>
/* ==========================================================================
   widgets.js — engine helpers and device-neutral widgets.
   Device widgets live in widgets-<device>.js and register themselves with
   W.register(type, builder). Classic script; exposes window.T1W.
   (The global keeps its original name so every coach shares one engine.)
   ========================================================================== */
(function () {
  'use strict';

  var W = {};
  var DEV = window.COACH_DEVICE || {};
  var NOTE = DEV.notation || {};

  /* ---------------------------------------------------------------- helpers */

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  W.esc = esc;

  function el(tag, cls, html) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (html != null) n.innerHTML = html;
    return n;
  }
  W.el = el;

  /* ------------------------------------------------------- notation -> chips
       [KEY]   key chip; the device config marks pad keys and the modifier
       (KNOB)  knob chip
       {val}   value chip; a leading ! draws the negation overline
       `PARM`  parameter chip styled like the device screen; a leading ^ inverts it
  ---------------------------------------------------------------------------*/

  var TOKEN = /\[([A-Z0-9 /&+–-]{1,24})\]|\(([A-Z0-9 /&+–.-]{1,20})\)|\{([^{}]{1,32})\}|`([^`]{1,24})`/g;

  function keyClass(name) {
    if (NOTE.pad && NOTE.pad.test(name)) return 'chip chip--pad';
    if (NOTE.mod && NOTE.mod.test(name)) return 'chip chip--mod';
    return 'chip chip--key';
  }

  W.notate = function (text) {
    if (text == null) return '';
    var out = '';
    var last = 0;
    var s = String(text);
    s.replace(TOKEN, function (m, key, knob, val, param, idx) {
      out += esc(s.slice(last, idx));
      if (key != null) {
        out += '<span class="' + keyClass(key) + '">[' + esc(key) + ']</span>';
      } else if (knob != null) {
        out += '<span class="chip chip--knob">' + esc(knob) + '</span>';
      } else if (val != null) {
        if (val.charAt(0) === '!' && val.length > 1) {
          out += '<span class="chip chip--val"><span class="neg">' + esc(val.slice(1)) + '</span></span>';
        } else {
          out += '<span class="chip chip--val">' + esc(val) + '</span>';
        }
      } else {
        var inv = param.charAt(0) === '^';
        out += '<span class="chip chip--param' + (inv ? ' is-locked' : '') + '">' +
          esc(inv ? param.slice(1) : param) + '</span>';
      }
      last = idx + m.length;
      return m;
    });
    out += esc(s.slice(last));
    return out;
  };

  /* Every token in a string, for the content audit. */
  W.tokens = function (text) {
    var found = [];
    String(text || '').replace(TOKEN, function (m, key, knob, val, param) {
      found.push(key != null ? { t: 'key', v: key } : knob != null ? { t: 'knob', v: knob } :
        val != null ? { t: 'val', v: val } : { t: 'param', v: param.replace(/^\^/, '') });
      return m;
    });
    return found;
  };

  /* --------------------------------------------------------------- registry */

  var registry = {};
  W.register = function (type, builder) { registry[type] = builder; };

  W.build = function (spec) {
    if (!spec || !spec.type || !registry[spec.type]) return null;
    try { return registry[spec.type](spec); }
    catch (e) { return el('div', 'widget', '<div class="widget__body readout">This diagram failed to draw.</div>'); }
  };

  W.frame = function (title, extraHead) {
    var wrap = el('div', 'widget');
    var head = el('div', 'widget__head', '<span class="widget__title">' + esc(title) + '</span>');
    if (extraHead) head.appendChild(extraHead);
    wrap.appendChild(head);
    var body = el('div', 'widget__body');
    wrap.appendChild(body);
    wrap.body = body;
    wrap.head = head;
    return wrap;
  };

  /* A row of toggle buttons; onPick(value). */
  W.picker = function (options, current, onPick, label) {
    var bar = el('div', 'picker');
    if (label) bar.setAttribute('aria-label', label);
    bar.setAttribute('role', 'group');
    options.forEach(function (o) {
      var v = typeof o === 'object' ? o.v : o;
      var lab = typeof o === 'object' ? o.l : o;
      var b = el('button', 'pick' + (v === current ? ' is-on' : ''), W.notate(lab));
      b.type = 'button';
      b.setAttribute('aria-pressed', v === current ? 'true' : 'false');
      b.addEventListener('click', function () {
        [].forEach.call(bar.children, function (c) { c.classList.remove('is-on'); c.setAttribute('aria-pressed', 'false'); });
        b.classList.add('is-on');
        b.setAttribute('aria-pressed', 'true');
        onPick(v);
      });
      bar.appendChild(b);
    });
    return bar;
  };

  /* A labelled range slider. */
  W.slider = function (host, label, min, max, value, fmt, onInput, step) {
    var c = el('div', 'ctrl');
    var lab = el('div', 'ctrl__lab', '<span>' + esc(label) + '</span><span class="ctrl__val"></span>');
    var input = document.createElement('input');
    input.type = 'range';
    input.min = String(min);
    input.max = String(max);
    input.step = String(step || 1);
    input.value = String(value);
    input.id = 'w-' + label.replace(/\W+/g, '').toLowerCase() + '-' + Math.random().toString(36).slice(2, 7);
    input.setAttribute('aria-label', label);
    c.appendChild(lab);
    c.appendChild(input);
    host.appendChild(c);
    var vEl = lab.querySelector('.ctrl__val');
    function sync() { vEl.textContent = fmt ? fmt(Number(input.value)) : input.value; }
    input.addEventListener('input', function () { sync(); onInput(Number(input.value)); });
    sync();
    return input;
  };

  /* ------------------------------------------------------------- step grid
     perRow lets a device draw its own key layout — the Digitakt has two rows
     of eight trig keys. marks maps step index -> extra classes.            */

  W.grid = function (opts) {
    var steps = opts.steps || 16;
    var perRow = opts.perRow || 16;
    var marks = opts.marks || {};
    var on = opts.on || [];
    var labels = opts.labels || {};
    var playhead = typeof opts.playhead === 'number' ? opts.playhead : -1;
    var beat = opts.beatEvery || 4;

    var wrap = el('div', 'grid' + (perRow === 8 ? ' grid--pads' : ''));
    for (var r = 0; r < Math.ceil(steps / perRow); r++) {
      var row = el('div', 'grid__row');
      var from = r * perRow;
      var count = Math.min(perRow, steps - from);
      row.style.gridTemplateColumns = 'repeat(' + perRow + ', minmax(0, 1fr))';
      for (var i = 0; i < count; i++) {
        var idx = from + i;
        var cls = 'cell';
        if (on[idx]) cls += ' on';
        if (marks[idx]) cls += ' ' + marks[idx];
        if (idx % beat === 0) cls += ' beat';
        if (idx === playhead) cls += ' play';
        var inner = labels[idx] != null ? esc(labels[idx]) : String(idx + 1);
        var c = el('div', cls, '<span class="cell__n">' + inner + '</span>');
        c.setAttribute('data-step', String(idx));
        row.appendChild(c);
      }
      wrap.appendChild(row);
    }
    return wrap;
  };

  /* ---------------------------------------------------------- colour legend */

  W.register('colours', function (spec) {
    var f = W.frame(spec.title || 'What the lights mean');
    var g = el('div', 'legend');
    (spec.rows || []).forEach(function (r) {
      var i = el('div', 'legend__i');
      var sw = el('span', 'legend__sw' + (r.blink ? ' is-blink' : '') + (r.ring ? ' is-ring' : ''));
      sw.style.background = r.ring ? 'transparent' : r.c;
      if (r.ring) sw.style.borderColor = r.c;
      i.appendChild(sw);
      i.appendChild(el('span', '', W.notate(r.t)));
      g.appendChild(i);
    });
    f.body.appendChild(g);
    return f;
  });

  /* ------------------------------------------------------------ static grid */

  W.register('grid', function (spec) {
    var f = W.frame(spec.title || 'Step grid');
    f.body.appendChild(W.grid({
      steps: spec.steps || 16, perRow: spec.perRow || 16,
      on: spec.on || [], marks: spec.marks || {}, labels: spec.labels || {}
    }));
    if (spec.note) f.body.appendChild(el('div', 'readout', W.notate(spec.note)));
    return f;
  });

  /* ------------------------------------------------------------------ table */

  W.register('table', function (spec) {
    var f = W.frame(spec.title || '');
    var tw = el('div', 'tablewrap');
    var t = document.createElement('table');
    t.className = 'wtable';
    if (spec.head) {
      var th = document.createElement('thead');
      th.innerHTML = '<tr>' + spec.head.map(function (h) { return '<th>' + W.notate(h) + '</th>'; }).join('') + '</tr>';
      t.appendChild(th);
    }
    var tb = document.createElement('tbody');
    (spec.rows || []).forEach(function (r) {
      tb.insertAdjacentHTML('beforeend', '<tr>' + r.map(function (c) { return '<td>' + W.notate(c) + '</td>'; }).join('') + '</tr>');
    });
    t.appendChild(tb);
    tw.appendChild(t);
    f.body.appendChild(tw);
    if (spec.note) f.body.appendChild(el('div', 'readout', W.notate(spec.note)));
    return f;
  });

  /* Small maths helpers shared by device widgets. */
  W.gcd = function (a, b) { while (b) { var t = b; b = a % b; a = t; } return a; };
  W.lcm = function (a, b) { return (a / W.gcd(a, b)) * b; };

  /* Deterministic random numbers, so a diagram shows the same "random" run
     until the viewer asks for a new one. */
  W.rng = function (seed) {
    var s = seed >>> 0 || 1;
    return function () {
      s ^= s << 13; s >>>= 0;
      s ^= s >>> 17;
      s ^= s << 5; s >>>= 0;
      return (s % 100000) / 100000;
    };
  };

  window.T1W = W;
})();
</script>
<script>
/* ==========================================================================
   widgets-digitakt.js — diagrams for what the Digitakt only shows in LEDs.
   Behaviour follows the Digitakt User Manual, OS 1.52A; page numbers are
   noted beside each model so the logic can be checked against the source.
   ========================================================================== */
(function () {
  'use strict';

  var W = window.T1W;
  var el = W.el;
  var esc = W.esc;
  var DT = {};

  var TRACK_NAMES = ['KICK', 'SNARE', 'TOM', 'CLAP', 'COWBELL', 'CL HAT', 'OP HAT', 'CYMBAL',
    'MIDI A', 'MIDI B', 'MIDI C', 'MIDI D', 'MIDI E', 'MIDI F', 'MIDI G', 'MIDI H'];

  /* =========================================================================
     Trig condition logic (manual p. 38)
       A:B  true on pass A, then every B passes: 2:4 -> 2, 6, 10 …
       1ST  true only on the first pass; negated: every pass but the first
       FILL true while fill mode is on; negated: while it is off
       X%   true with probability X
       PRE  true if the most recent evaluated condition on this track was true
            (PRE-type trigs are not themselves evaluated)
       NEI  as PRE, but reads the neighbour track (the one before); false if
            the neighbour has no conditional trigs
     ========================================================================= */

  DT.cond = function (c, ctx) {
    var r;
    switch (c.k) {
      case 'AB':    r = ((ctx.loop - 1) % c.b) === (c.a - 1); break;
      case 'FIRST': r = ctx.loop === 1; break;
      case 'FILL':  r = !!ctx.fill; break;
      case 'PCT':   r = ctx.rnd() < c.p / 100; break;
      case 'PRE':   r = ctx.pre === true; break;
      case 'NEI':   r = ctx.nei === true; break;
      default:      r = true;
    }
    return c.neg ? !r : r;
  };

  /* Evaluate several tracks over one pattern pass, in time order.
     tracks: [{ id, trigs: [{ step, c }] }]; state carries "most recent"
     results between passes. Returns { trackId: [results in step order] }. */
  DT.runPass = function (tracks, loop, fill, rnd, state) {
    state = state || {};
    var out = {};
    var events = [];
    tracks.forEach(function (t) {
      out[t.id] = [];
      t.trigs.forEach(function (tr, i) { events.push({ t: t, tr: tr, i: i }); });
    });
    events.sort(function (a, b) { return a.tr.step - b.tr.step || a.t.id - b.t.id; });
    events.forEach(function (e) {
      var neighbour = state[e.t.id - 1];
      var ctx = {
        loop: loop, fill: fill, rnd: rnd,
        pre: state[e.t.id] === undefined ? null : state[e.t.id],
        nei: neighbour === undefined ? null : neighbour
      };
      var res = DT.cond(e.tr.c, ctx);
      if (e.tr.c.k !== 'PRE') state[e.t.id] = res;   // PRE and !PRE are not evaluated
      out[e.t.id][e.i] = res;
    });
    return out;
  };

  /* ----------------------------------------------------------- pad grid
     The Digitakt draws a pattern page as two rows of eight trig keys.    */

  DT.pads = function (opts) {
    var marks = {};
    var labels = {};
    (opts.note || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-note'; });
    (opts.lock || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-lock'; });
    (opts.locked || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-locked'; });
    (opts.cond || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-cond'; });
    (opts.dim || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-dim'; });
    (opts.blue || []).forEach(function (s) { marks[s - 1] = (marks[s - 1] || '') + ' t-blue'; });
    Object.keys(opts.labels || {}).forEach(function (k) { labels[k - 1] = opts.labels[k]; });
    if (opts.trackNames) TRACK_NAMES.forEach(function (n, i) { if (labels[i] == null) labels[i] = n; });
    return W.grid({
      steps: opts.steps || 16, perRow: 8, marks: marks, labels: labels,
      playhead: typeof opts.playhead === 'number' ? opts.playhead : -1
    });
  };

  W.register('pads', function (spec) {
    var f = W.frame(spec.title || 'Trig keys');
    f.body.appendChild(DT.pads(spec));
    if (spec.caption) f.body.appendChild(el('div', 'readout', W.notate(spec.caption)));
    return f;
  });

  /* ------------------------------------------------ condition explorer */

  var COND_OPTIONS = [
    { v: '1:2', c: { k: 'AB', a: 1, b: 2 } },
    { v: '2:2', c: { k: 'AB', a: 2, b: 2 } },
    { v: '2:4', c: { k: 'AB', a: 2, b: 4 } },
    { v: '4:4', c: { k: 'AB', a: 4, b: 4 } },
    { v: '1:8', c: { k: 'AB', a: 1, b: 8 } },
    { v: '4:7', c: { k: 'AB', a: 4, b: 7 } },
    { v: '1ST', c: { k: 'FIRST' } },
    { v: '!1ST', c: { k: 'FIRST', neg: true } },
    { v: 'FILL', c: { k: 'FILL' } },
    { v: '!FILL', c: { k: 'FILL', neg: true } },
    { v: '25%', c: { k: 'PCT', p: 25 } },
    { v: '50%', c: { k: 'PCT', p: 50 } },
    { v: '75%', c: { k: 'PCT', p: 75 } }
  ];
  var FILL_LOOPS = [4, 8, 12, 16];

  function label(v) { return v.charAt(0) === '!' ? '{' + v + '}' : '{' + v + '}'; }

  W.register('conditions', function (spec) {
    var LOOPS = 16;
    var seed = 7;
    var pick = spec.start || '2:4';
    var timer = null;
    var pos = 0;

    var reroll = el('button', 'tool', 'New random run');
    reroll.type = 'button';
    var f = W.frame(spec.title || 'Trig condition explorer — which passes of the pattern fire?', reroll);

    var picker = W.picker(COND_OPTIONS.map(function (o) { return { v: o.v, l: label(o.v) }; }),
      pick, function (v) { pick = v; draw(); }, 'Trig condition');
    f.body.appendChild(picker);

    var strip = el('div', 'loops');
    f.body.appendChild(strip);
    var readout = el('div', 'readout');
    f.body.appendChild(readout);

    /* PRE / NEI demonstration */
    var chainHead = el('div', 'subhead', 'PRE and NEI — trigs that answer other trigs');
    f.body.appendChild(chainHead);
    var chain = el('div', 'chain');
    f.body.appendChild(chain);
    var chainNote = el('div', 'readout');
    f.body.appendChild(chainNote);

    reroll.addEventListener('click', function () { seed = (seed * 48271 + 11) % 2147483647; draw(); });

    function current() {
      for (var i = 0; i < COND_OPTIONS.length; i++) if (COND_OPTIONS[i].v === pick) return COND_OPTIONS[i].c;
      return COND_OPTIONS[0].c;
    }

    function draw() {
      var c = current();
      var rnd = W.rng(seed);
      var fired = [];
      for (var loop = 1; loop <= LOOPS; loop++) {
        var fill = FILL_LOOPS.indexOf(loop) >= 0;
        fired.push(DT.cond(c, { loop: loop, fill: fill, rnd: rnd }));
      }
      strip.innerHTML = '';
      fired.forEach(function (on, i) {
        var loopN = i + 1;
        var isFill = c.k === 'FILL' && FILL_LOOPS.indexOf(loopN) >= 0;
        var cell = el('div', 'loop' + (on ? ' on' : '') + (isFill ? ' is-fill' : '') + (i === pos ? ' play' : ''),
          '<span class="loop__n">' + loopN + '</span>');
        cell.title = 'Pass ' + loopN + (on ? ' — fires' : ' — silent');
        strip.appendChild(cell);
      });
      var count = fired.filter(Boolean).length;
      var list = fired.map(function (on, i) { return on ? i + 1 : null; }).filter(Boolean);
      var text;
      if (c.k === 'AB') {
        text = 'Condition ' + label(pick) + ' fires on pass ' + list.join(', ') +
          ' — pass ' + c.a + ', then every ' + c.b + ' passes after that.';
      } else if (c.k === 'FIRST') {
        text = c.neg ? 'Every pass except the first. Use it for a part that joins in after the first time round.'
          : 'Only the very first pass after you press [PLAY] — an intro hit that never repeats.';
      } else if (c.k === 'FILL') {
        text = 'In this example fill mode is held on passes ' + FILL_LOOPS.join(', ') + ' (marked). ' +
          (c.neg ? 'This trig plays on every other pass and drops out during the fills.'
            : 'This trig plays only during the fills.');
      } else {
        text = 'This run: fired ' + count + ' of ' + LOOPS + ' passes; on average expect ' +
          Math.round(LOOPS * c.p / 100) + '. Press “New random run” to roll again.';
      }
      readout.innerHTML = W.notate(text);
      drawChain();
    }

    function drawChain() {
      var rnd = W.rng(seed + 99);
      var tracks = [
        { id: 3, trigs: [{ step: 1, c: { k: 'PCT', p: 50 } }, { step: 9, c: { k: 'PRE', neg: true } }] },
        { id: 4, trigs: [{ step: 5, c: { k: 'NEI' } }] }
      ];
      var state = {};
      var rows = { a: [], b: [], n: [] };
      for (var loop = 1; loop <= LOOPS; loop++) {
        var r = DT.runPass(tracks, loop, false, rnd, state);
        rows.a.push(r[3][0]); rows.b.push(r[3][1]); rows.n.push(r[4][0]);
      }
      chain.innerHTML = '';
      [
        { k: 'a', t: 'Track 3 · step 1 · {50%}' },
        { k: 'b', t: 'Track 3 · step 9 · {!PRE}' },
        { k: 'n', t: 'Track 4 · step 5 · {NEI}' }
      ].forEach(function (lane) {
        var row = el('div', 'chain__row');
        row.appendChild(el('div', 'chain__lab', W.notate(lane.t)));
        var cells = el('div', 'chain__cells');
        rows[lane.k].forEach(function (on) { cells.appendChild(el('div', 'loop sm' + (on ? ' on' : ''))); });
        row.appendChild(cells);
        chain.appendChild(row);
      });
      chainNote.innerHTML = W.notate(
        'The {50%} trig decides; the other two follow it. {!PRE} on the same track plays exactly when step 1 ' +
        'did not, so the track always plays one of the two — an either/or. {NEI} on track 4 looks back at its ' +
        'neighbour, track 3, and plays exactly when step 1 did — a call and its answer.');
    }

    function tick() {
      timer = setTimeout(function () { pos = (pos + 1) % LOOPS; draw(); tick(); }, 650);
    }

    draw();
    tick();
    f.destroy = function () { clearTimeout(timer); };
    return f;
  });

  /* ------------------------------------------- per-track length and scale
     Manual p. 36: speeds 1/8X–2X; M.LEN is how many steps play before every
     track restarts; INF never restarts. Loop durations are compared in
     twelfths of a 1X step so every speed gives a whole number.            */

  var SPEEDS = [
    { l: '1/8X', s: 1 / 8, d12: 96 }, { l: '1/4X', s: 1 / 4, d12: 48 }, { l: '1/2X', s: 1 / 2, d12: 24 },
    { l: '3/4X', s: 3 / 4, d12: 16 }, { l: '1X', s: 1, d12: 12 }, { l: '3/2X', s: 3 / 2, d12: 8 },
    { l: '2X', s: 2, d12: 6 }
  ];
  var MLENS = [{ l: '16', v: 16 }, { l: '32', v: 32 }, { l: '64', v: 64 }, { l: 'INF', v: 0 }];

  DT.realign = function (lanes, mlen) {
    var l12 = 12;
    lanes.forEach(function (ln) { l12 = W.lcm(l12, ln.len * SPEEDS[ln.si].d12); });
    var steps = l12 / 12;
    return mlen ? Math.min(steps, mlen) : steps;
  };

  W.register('scale', function (spec) {
    var lanes = (spec.lanes || [{ len: 16, si: 4 }, { len: 12, si: 4 }, { len: 16, si: 3 }]).map(function (l) {
      return { len: l.len, si: l.si == null ? 4 : l.si };
    });
    var mlen = spec.mlen == null ? 0 : spec.mlen;
    var SPAN = 64;

    var f = W.frame(spec.title || 'PER TRACK mode — lengths, speeds and the master length');
    var svgHost = el('div', 'scale');
    f.body.appendChild(svgHost);
    var controls = el('div', 'controls');
    f.body.appendChild(controls);

    lanes.forEach(function (ln, i) {
      W.slider(controls, 'Track ' + (i + 1) + ' length', 2, 32, ln.len, function (v) { return v + ' steps'; },
        function (v) { ln.len = v; draw(); });
      W.slider(controls, 'Track ' + (i + 1) + ' speed', 0, SPEEDS.length - 1, ln.si,
        function (v) { return SPEEDS[v].l; }, function (v) { ln.si = v; draw(); });
    });
    var mWrap = el('div', 'ctrl');
    mWrap.appendChild(el('div', 'ctrl__lab', '<span>Master length</span>'));
    mWrap.appendChild(W.picker(MLENS.map(function (m) { return { v: m.v, l: m.l }; }), mlen,
      function (v) { mlen = v; draw(); }, 'Master length'));
    controls.appendChild(mWrap);

    var readout = el('div', 'readout');
    f.body.appendChild(readout);

    function draw() {
      var w = 640, laneH = 26, gap = 10, top = 18;
      var h = top + lanes.length * (laneH + gap) + 6;
      var x = function (t) { return (t / SPAN) * w; };
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Track loops over 64 steps">';
      for (var b = 0; b <= SPAN; b += 16) {
        s += '<line class="sc-bar" x1="' + x(b) + '" y1="0" x2="' + x(b) + '" y2="' + h + '"/>';
        if (b < SPAN) s += '<text class="sc-lab" x="' + (x(b) + 3) + '" y="11">bar ' + (b / 16 + 1) + '</text>';
      }
      if (mlen) {
        for (var m = mlen; m < SPAN; m += mlen) {
          s += '<line class="sc-reset" x1="' + x(m) + '" y1="' + (top - 4) + '" x2="' + x(m) + '" y2="' + h + '"/>';
        }
      }
      lanes.forEach(function (ln, i) {
        var y = top + i * (laneH + gap);
        var sp = SPEEDS[ln.si].s;
        s += '<rect class="sc-lane" x="0" y="' + y + '" width="' + w + '" height="' + laneH + '" rx="3"/>';
        var segStart = 0;
        var loopIdx = 0;
        while (segStart < SPAN) {
          var segEnd = mlen ? Math.min(SPAN, segStart + mlen) : SPAN;
          for (var k = 0; ; k++) {
            var t = segStart + k / sp;
            if (t >= segEnd - 1e-9) break;
            var isStart = k % ln.len === 0;
            var cls = isStart ? (loopIdx % 2 ? 'sc-start alt' : 'sc-start') : 'sc-step';
            if (isStart) loopIdx++;
            var cw = Math.max(1.5, Math.min(x(1 / sp) - 1.5, 9));
            s += '<rect class="' + cls + '" x="' + x(t) + '" y="' + (y + (isStart ? 3 : 9)) + '" width="' +
              (isStart ? Math.max(2.5, cw) : 1.6) + '" height="' + (isStart ? laneH - 6 : laneH - 18) + '"/>';
          }
          segStart = segEnd;
        }
        s += '<text class="sc-name" x="6" y="' + (y + laneH - 8) + '">T' + (i + 1) + ' ' + ln.len + '·' + SPEEDS[ln.si].l + '</text>';
      });
      s += '</svg>';
      svgHost.innerHTML = s;

      var re = DT.realign(lanes, mlen);
      var reTxt = re % 16 === 0 ? (re / 16) + ' bar' + (re === 16 ? '' : 's') : re + ' steps';
      readout.innerHTML = W.notate(
        'Tall marks are each track’s step 1. ' +
        (mlen ? 'With `M.LEN` at ' + mlen + ' every track is pulled back to step 1 every ' + mlen + ' steps (the red lines), so the drift never runs longer than that. '
          : 'With `M.LEN` at {INF} nothing is reset, so the tracks drift freely. ') +
        'All three start together again after <b>' + reTxt + '</b>.').replace('&lt;b&gt;', '<b>').replace('&lt;/b&gt;', '</b>');
    }

    draw();
    return f;
  });

  /* ------------------------------------------------------------- retrigs
     Manual p. 34–35: RATE 1/1…1/80 (1/16 = one per step), VEL −128…127.  */

  var RATES = ['1/1', '1/2', '1/3', '1/4', '1/5', '1/6', '1/8', '1/10', '1/12', '1/16', '1/20', '1/24', '1/32', '1/40', '1/48', '1/64', '1/80'];

  DT.retrigVel = function (vel, t) {
    if (vel < 0) return 1 - (-vel / 128) * t;
    if (vel > 0) return (1 - vel / 127) + (vel / 127) * t;
    return 1;
  };

  W.register('retrig', function (spec) {
    var ri = RATES.indexOf(spec.rate || '1/32');
    var vel = spec.vel == null ? -64 : spec.vel;
    var f = W.frame(spec.title || 'Retrig — rate and velocity curve across one beat');
    var host = el('div', 'svgbox');
    f.body.appendChild(host);
    var controls = el('div', 'controls');
    f.body.appendChild(controls);
    W.slider(controls, 'RATE', 0, RATES.length - 1, ri, function (v) { return RATES[v]; }, function (v) { ri = v; draw(); });
    W.slider(controls, 'VEL', -128, 127, vel, function (v) { return v; }, function (v) { vel = v; draw(); });
    var readout = el('div', 'readout');
    f.body.appendChild(readout);

    function draw() {
      var n = Number(RATES[ri].split('/')[1]);
      var interval = 16 / n;            // in steps
      var window = 4;                    // one beat
      var w = 640, h = 120, base = 108;
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Retrig hits">';
      for (var st = 0; st <= window; st++) {
        s += '<line class="sc-bar" x1="' + (st / window) * w + '" y1="0" x2="' + (st / window) * w + '" y2="' + h + '"/>';
      }
      var hits = 0;
      for (var t = 0; t < window - 1e-9; t += interval) {
        var v = DT.retrigVel(vel, t / window);
        var x = (t / window) * w;
        s += '<rect class="rt-hit" x="' + (x + 1) + '" y="' + (base - v * 96) + '" width="' + Math.max(2, Math.min(14, (interval / window) * w - 3)) +
          '" height="' + (v * 96 + 1) + '"/>';
        hits++;
      }
      s += '</svg>';
      host.innerHTML = s;
      var perStep = n / 16;
      readout.innerHTML = W.notate(
        '{' + RATES[ri] + '} = ' + (perStep >= 1 ? perStep + ' hit' + (perStep === 1 ? '' : 's') + ' per step'
          : 'one hit every ' + (1 / perStep) + ' steps') + ' — ' + hits + ' hits in this beat. ' +
        ([12, 24, 48].indexOf(n) >= 0 ? 'A triplet rate. ' : '') +
        (vel < 0 ? 'Negative `VEL` fades the burst out.' : vel > 0 ? 'Positive `VEL` fades the burst in.' : '`VEL` at 0 keeps every hit equal.') +
        ' The drawing assumes the retrig length spans this beat.');
    }
    draw();
    return f;
  });

  /* ----------------------------------------------------------------- LFO
     Shapes and trig modes after the diagram on manual p. 48.              */

  var WAVES = ['TRI', 'SIN', 'SQR', 'SAW', 'EXP', 'RMP', 'RND'];
  var MODES = ['FRE', 'TRG', 'HLD', 'ONE', 'HLF'];
  var RND_STEPS = [0.62, -0.35, 0.9, -0.8, 0.1, 0.45, -0.6, 0.25];

  DT.wave = function (w, p) {
    p = ((p % 1) + 1) % 1;
    switch (w) {
      case 'TRI': return p < 0.25 ? 4 * p : p < 0.75 ? 2 - 4 * p : 4 * p - 4;
      case 'SIN': return Math.sin(2 * Math.PI * p);
      case 'SQR': return p < 0.5 ? 1 : -1;
      case 'SAW': return 1 - 2 * p;
      case 'EXP': return (Math.exp(-5 * p) - Math.exp(-5)) / (1 - Math.exp(-5));
      case 'RMP': return p;
      default:    return RND_STEPS[Math.floor(p * RND_STEPS.length) % RND_STEPS.length];
    }
  };
  function rest(w) { return w === 'SAW' ? -1 : 0; }

  DT.lfoAt = function (w, mode, t, cycle, trigs) {
    var last = null;
    for (var i = 0; i < trigs.length; i++) if (trigs[i] <= t) last = trigs[i];
    if (mode === 'FRE' || last === null) return DT.wave(w, t / cycle);
    var ph = (t - last) / cycle;
    if (mode === 'TRG') return DT.wave(w, ph);
    if (mode === 'HLD') return DT.wave(w, last / cycle);
    if (mode === 'ONE') return ph >= 1 ? rest(w) : DT.wave(w, ph);
    /* HLF */ return ph >= 0.5 ? (w === 'SQR' ? 0 : DT.wave(w, 0.5)) : DT.wave(w, ph);
  };

  W.register('lfo', function (spec) {
    var wave = spec.wave || 'TRI';
    var mode = spec.mode || 'TRG';
    var trigs = spec.trigs || [0, 6, 10];
    var cycle = 8;
    var f = W.frame(spec.title || 'LFO waveform and trig mode');
    f.body.appendChild(W.picker(WAVES, wave, function (v) { wave = v; draw(); }, 'WAVE'));
    f.body.appendChild(W.picker(MODES, mode, function (v) { mode = v; draw(); }, 'MODE'));
    var host = el('div', 'svgbox');
    f.body.appendChild(host);
    var readout = el('div', 'readout');
    f.body.appendChild(readout);
    var NOTES = {
      FRE: 'Free-running: the LFO ignores trigs and keeps its own cycle.',
      TRG: 'Restarts from its start phase on every trig, so each note gets the same movement.',
      HLD: 'Runs in the background (faint line); each trig freezes whatever value it had reached — a new random-ish value per note.',
      ONE: 'Starts on a trig, runs one full cycle and stops — an extra envelope.',
      HLF: 'Starts on a trig, runs half a cycle and stops — a one-way sweep.'
    };

    function draw() {
      var w = 640, h = 130, mid = 65, amp = 50, span = 16;
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="LFO output">';
      s += '<line class="sc-bar" x1="0" y1="' + mid + '" x2="' + w + '" y2="' + mid + '"/>';
      trigs.forEach(function (t) {
        var x = (t / span) * w;
        s += '<line class="lfo-trig" x1="' + x + '" y1="4" x2="' + x + '" y2="' + (h - 4) + '"/>';
        s += '<text class="sc-lab" x="' + (x + 3) + '" y="12">TRIG</text>';
      });
      function path(fn) {
        var pts = [];
        for (var i = 0; i <= 400; i++) {
          var t = (i / 400) * span;
          pts.push(((t / span) * w).toFixed(1) + ',' + (mid - fn(t) * amp).toFixed(1));
        }
        return pts.join(' ');
      }
      if (mode === 'HLD') {
        s += '<polyline class="lfo-ghost" points="' + path(function (t) { return DT.wave(wave, t / cycle); }) + '"/>';
      }
      s += '<polyline class="lfo-out" points="' + path(function (t) { return DT.lfoAt(wave, mode, t, cycle, trigs); }) + '"/>';
      s += '</svg>';
      host.innerHTML = s;
      readout.innerHTML = W.notate('`WAVE` {' + wave + '}, `MODE` {' + mode + '}. ' + NOTES[mode] +
        (wave === 'EXP' || wave === 'RMP' ? ' EXP and RMP are unipolar — they only push the destination one way.' : ''));
    }
    draw();
    return f;
  });

  /* --------------------------------------------------------- amp envelope
     Manual p. 46–47: ATK, HOLD (0–126 or NOTE), DEC (0–126 or INF).        */

  W.register('ampenv', function (spec) {
    var atk = spec.atk == null ? 8 : spec.atk;
    var hold = spec.hold == null ? 20 : spec.hold;
    var dec = spec.dec == null ? 50 : spec.dec;
    var noteMode = !!spec.note;
    var noteLen = 40;
    var f = W.frame(spec.title || 'Amp envelope — ATK, HOLD, DEC');
    var host = el('div', 'svgbox');
    f.body.appendChild(host);
    var controls = el('div', 'controls');
    f.body.appendChild(controls);
    W.slider(controls, 'ATK', 0, 127, atk, null, function (v) { atk = v; draw(); });
    W.slider(controls, 'HOLD', 0, 127, noteMode ? 127 : hold, function (v) { return v === 127 ? 'NOTE' : v; },
      function (v) { noteMode = v === 127; hold = v; draw(); });
    W.slider(controls, 'DEC', 0, 127, dec, function (v) { return v === 127 ? 'INF' : v; }, function (v) { dec = v; draw(); });
    W.slider(controls, 'Note length', 4, 110, noteLen, null, function (v) { noteLen = v; draw(); });
    var readout = el('div', 'readout');
    f.body.appendChild(readout);

    function draw() {
      var w = 640, h = 130, base = 118, top = 16, total = 300;
      var sx = function (t) { return Math.min(w, (t / total) * w); };
      var a = atk, hEnd = noteMode ? Math.max(a, noteLen * 2) : a + hold;
      var pts = ['0,' + base, sx(a) + ',' + top, sx(hEnd) + ',' + top];
      if (dec >= 127) pts.push(w + ',' + top);
      else pts.push(sx(hEnd + dec) + ',' + base, w + ',' + base);
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Amp envelope">';
      s += '<line class="sc-bar" x1="0" y1="' + base + '" x2="' + w + '" y2="' + base + '"/>';
      var off = sx(noteLen * 2);
      s += '<line class="lfo-trig" x1="' + off + '" y1="4" x2="' + off + '" y2="' + (h - 4) + '"/>';
      s += '<text class="sc-lab" x="' + (off + 3) + '" y="12">note off</text>';
      s += '<polyline class="env" points="' + pts.join(' ') + '"/>';
      s += '</svg>';
      host.innerHTML = s;
      readout.innerHTML = W.notate(noteMode
        ? '`HOLD` {NOTE}: the sound holds for as long as the note does — the trig length, or how long a key is held — then decays.'
        : 'Fixed `HOLD`: the envelope ignores the note-off entirely. Move “Note length” and nothing changes.' +
          (dec >= 127 ? ' `DEC` {INF}: it never decays — the sound plays until the sample ends.' : ''));
    }
    draw();
    return f;
  });

  /* --------------------------------------------------------------- swing
     Manual p. 39: SWING 51–80 %, default 50 %.                             */

  W.register('swing', function (spec) {
    var sw = spec.swing || 62;
    var f = W.frame(spec.title || 'Swing — where the second sixteenth of each pair lands');
    var host = el('div', 'svgbox');
    f.body.appendChild(host);
    var controls = el('div', 'controls');
    f.body.appendChild(controls);
    W.slider(controls, 'SWING', 50, 80, sw, function (v) { return v + '%'; }, function (v) { sw = v; draw(); });
    var readout = el('div', 'readout');
    f.body.appendChild(readout);

    function draw() {
      var w = 640, h = 70;
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Swing positions">';
      for (var i = 0; i < 16; i++) {
        var x = (i / 16) * w;
        s += '<line class="sc-bar" x1="' + x + '" y1="8" x2="' + x + '" y2="' + (h - 8) + '"/>';
      }
      for (var p = 0; p < 8; p++) {
        var x1 = (p * 2 / 16) * w;
        var x2 = ((p * 2 + 2 * sw / 100) / 16) * w;
        s += '<rect class="sw-on" x="' + (x1 + 1) + '" y="18" width="10" height="34" rx="2"/>';
        s += '<rect class="sw-off" x="' + (x2 + 1) + '" y="26" width="10" height="26" rx="2"/>';
      }
      s += '</svg>';
      host.innerHTML = s;
      var feel = sw < 53 ? 'Straight.' : sw < 60 ? 'A gentle lean — felt more than heard.' :
        sw < 64 ? 'A clear shuffle — house and garage live here.' :
        sw < 70 ? 'Around 67 % the off-sixteenths sit on the triplet position: a full shuffle.' :
        'Past the triplet — towards a dotted, lopsided skip.';
      readout.innerHTML = W.notate('`SWING` ' + sw + '%. ' + feel);
    }
    draw();
    return f;
  });

  /* --------------------------------------------------------------- slice
     Manual p. 86–87: GRID 4–64 slices; linear or random slice locks.       */

  W.register('slice', function (spec) {
    var grid = spec.grid || 16;
    var trigSteps = spec.trigs || [1, 3, 5, 7, 9, 11, 13, 15];
    var alloc = 'linear';
    var seed = 3;
    var again = el('button', 'tool', 'Random again');
    again.type = 'button';
    var f = W.frame(spec.title || 'Slice machine — slices, and which slice each trig plays', again);
    f.body.appendChild(W.picker([8, 16, 32, 64].map(function (g) { return { v: g, l: '{' + g + '}' }; }), grid,
      function (v) { grid = v; draw(); }, '`GRID`'));
    f.body.appendChild(W.picker([{ v: 'linear', l: 'Linear locks' }, { v: 'random', l: 'Random locks' }], alloc,
      function (v) { alloc = v; draw(); }, 'Allocation'));
    var host = el('div', 'svgbox');
    f.body.appendChild(host);
    var padsHost = el('div', '');
    f.body.appendChild(padsHost);
    var readout = el('div', 'readout');
    f.body.appendChild(readout);
    again.addEventListener('click', function () { seed += 1; alloc = 'random'; draw(); });

    function draw() {
      var w = 640, h = 80, mid = 40;
      var r = W.rng(41);
      var s = '<svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" role="img" aria-label="Sample cut into slices">';
      var pts = [];
      for (var i = 0; i <= 320; i++) {
        var env = Math.pow(1 - ((i % 40) / 40), 2) * 0.9 + 0.08;
        var v = (r() * 2 - 1) * env;
        pts.push(((i / 320) * w).toFixed(1) + ',' + (mid - v * 34).toFixed(1));
      }
      s += '<polyline class="wav" points="' + pts.join(' ') + '"/>';
      for (var g = 1; g < grid; g++) {
        var x = (g / grid) * w;
        s += '<line class="sl-cut" x1="' + x + '" y1="4" x2="' + x + '" y2="' + (h - 4) + '"/>';
      }
      s += '</svg>';
      host.innerHTML = s;
      var rr = W.rng(seed * 131 + 7);
      var labels = {};
      trigSteps.forEach(function (st, i) {
        labels[st] = alloc === 'linear' ? String(i + 1) : String(1 + Math.floor(rr() * grid));
      });
      padsHost.innerHTML = '';
      padsHost.appendChild(DT.pads({ note: trigSteps, labels: labels }));
      readout.innerHTML = W.notate(alloc === 'linear'
        ? 'Linear locks: the first trig plays slice 1, the next slice 2, and so on — the break plays back in order.'
        : 'Random locks: every trig gets a random slice lock. Each time you create them again you get a new edit.');
    }
    draw();
    return f;
  });

  /* ------------------------------------------------------------ page map
     Parameter positions follow the order the manual lists them (and the
     CC/NRPN order in Appendix B), which matches knobs A–H.                 */

  var PAGES = {
    trig:     { t: 'TRIG page (audio track)', p: ['NOTE', 'VEL', 'LEN', 'PROB', '', '', '', ''], note: 'Knob (D) becomes `COND` on a trig with a condition. `FLT.T` and `LFO.T` sit on the remaining knobs.' },
    src:      { t: 'SRC page — Oneshot machine', p: ['TUNE', 'PLAY', 'BR', 'SAMP', 'STRT', 'LEN', 'LOOP', 'LEV'] },
    werp:     { t: 'SRC page — Werp machine', p: ['TUNE', 'PLAY', 'BR', 'SAMP', 'SEG', 'MODE', 'BARS', 'LEV'] },
    repitch:  { t: 'SRC page — Repitch machine', p: ['', 'PLAY', 'BR', 'SAMP', 'STRT', 'LEN', 'BARS', 'LEV'] },
    slice:    { t: 'SRC page — Slice machine', p: ['TUNE', 'PLAY', 'BR', 'SAMP', 'SLICE', 'LEN', 'GRID', 'LEV'] },
    fltr:     { t: 'FLTR page 1', p: ['ATK', 'DEC', 'SUS', 'REL', 'FREQ', 'RESO', 'TYPE', 'ENV'] },
    amp:      { t: 'AMP page', p: ['ATK', 'HOLD', 'DEC', 'OVER', 'DEL', 'REV', 'PAN', 'VOL'] },
    lfo:      { t: 'LFO page (LFO 1; press [LFO] again for LFO 2)', p: ['SPD', 'MULT', 'FADE', 'DEST', 'WAVE', 'PHAS', 'MODE', 'DEP'] },
    delay:    { t: 'DELAY page — [FUNC] + [FLTR]', p: ['TIME', 'X', 'WID', 'FDBK', 'HPF', 'LPF', 'REV', 'VOL'] },
    reverb:   { t: 'REVERB page — [FUNC] + [AMP]', p: ['PRE', 'DEC', 'FREQ', 'GAIN', 'HPF', 'LPF', 'REV', 'VOL'] },
    midisrc:  { t: 'SRC page (MIDI track)', p: ['CHAN', 'BANK', 'SBNK', 'PROG', 'PB', 'AT', 'MW', 'BC'] },
    midifltr: { t: 'FLTR page (MIDI track) — CC values', p: ['VAL1', 'VAL2', 'VAL3', 'VAL4', 'VAL5', 'VAL6', 'VAL7', 'VAL8'] },
    midiamp:  { t: 'AMP page (MIDI track) — CC numbers', p: ['SEL1', 'SEL2', 'SEL3', 'SEL4', 'SEL5', 'SEL6', 'SEL7', 'SEL8'] }
  };

  DT.PAGES = PAGES;

  W.register('page', function (spec) {
    var pg = PAGES[spec.page];
    if (!pg) return null;
    var f = W.frame(spec.title || pg.t);
    var screen = el('div', 'oled');
    'ABCDEFGH'.split('').forEach(function (k, i) {
      var name = pg.p[i];
      var locked = spec.locked && spec.locked.indexOf(name) >= 0;
      var cell = el('div', 'oled__cell' + (name ? '' : ' is-empty') + (locked ? ' is-locked' : ''),
        '<span class="oled__p">' + (name ? esc(name) : '—') + '</span><span class="oled__k">' + k + '</span>');
      screen.appendChild(cell);
    });
    f.body.appendChild(screen);
    var note = spec.note || pg.note;
    if (note) f.body.appendChild(el('div', 'readout', W.notate(note)));
    return f;
  });

  W.dt = DT;
})();
</script>
